<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Sem conexão · Igreja de Cristo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #050505; color: #d4d4d4; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 28px; color: #fff; letter-spacing: -.02em; line-height: 1.1; }
  p { font-size: 16px; line-height: 1.55; color: #a3a3a3; }
  blockquote { font-family: Georgia, serif; font-style: italic; font-size: 19px; color: #ededed; line-height: 1.4; }
  blockquote span { display: block; margin-top: 6px; font-family: system-ui, sans-serif; font-style: normal; font-size: 13px; color: #737373; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: #ededed; color: #050505; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/pwa/icon-192.png" alt="Igreja de Cristo">
  <h1>Você está sem internet</h1>
  <p>Assim que a conexão voltar, toque no botão abaixo para continuar de onde parou.</p>
  <blockquote>“Aquietai-vos, e sabei que eu sou Deus.”<span>Salmos 46:10</span></blockquote>
  <a href="/">Tentar novamente</a>
</main>
</body>
</html>
